name: Push digest
# Every 2h on weekdays 09:30–19:30 IST (filings arrive all day; prices settle after 15:30),
# plus manual runs. Output is committed — git is FINN's database and audit log.
on:
  schedule:
    - cron: "0 4-14/2 * * 1-5"
  push:
    branches: [main]
    paths: [".github/digest-request"]
  workflow_dispatch:
    inputs:
      window_days:
        description: "Days of filings to cover"
        default: "30"
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build digest
        run: npx tsx scripts/ingest.ts ${{ github.event.inputs.window_days || '30' }} 2>&1 | tee data/last-run.log
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          git add public/data data
          git diff --cached --quiet || git commit -m "data: digest $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X ours && git push
