name: Research dossiers
# Precomputes dossiers for the demo set (or any symbols you pass) so they open instantly.
# Any other ticker is built live in the app.
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated NSE symbols (blank = demo set)"
        default: ""
  push:
    branches: [main]
    paths: [".github/research-request"]
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build dossiers
        run: |
          SYMS="${{ github.event.inputs.symbols }}"
          [ -z "$SYMS" ] && [ -f .github/research-request ] && SYMS="$(cat .github/research-request)"
          npx tsx scripts/research.ts $SYMS 2>&1 | tee data/last-research.log
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          git add public/data data
          git diff --cached --quiet || git commit -m "data: research $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X ours && git push
